<section class="w-full flex justify-center items-start mt-5">
    <div class="w-[70%]">
        <div class="flex justify-between items-center w-full mb-5">
            <div>
                <label for="images" class="
                    cursor-pointer 
                    border 
                    border-blue-800
                    px-4
                    py-2
                    rounded-lg
                    text-blue-800
                    transition
                    hover:bg-blue-100">
                    เลือกรูปภาพ
                </label>
                <input id="images" type="file" accept="image/*" class="hidden" multiple
                    (change)="onFilesSelected($event)" />
            </div>

            <button type="button" (click)="uploadImages()" [disabled]="selectedFiles.length === 0"
                class="rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50 cursor-pointer hover:bg-blue-500 transition">
                ค้นหาประตู
            </button>
        </div>

        <div class="flex flex-wrap justify-between gap-2 w-full">
            @for (image of previewImages; track image.url) {
            <div class="w-[49%] border rounded bg-gray-200 p-2">
                <div class="flex justify-between items-center mb-3">
                    <p class="truncate text-sm">{{ image.name }}</p>
                    <button type="button" (click)="removeImage(image)" class="rounded bg-red-600 p-1 text-white disabled:opacity-50 cursor-pointer hover:bg-red-500 transition">
                        ลบ
                    </button>
                </div>
                <img [src]="image.url" [alt]="image.name" class="object-cover w-full" />
            </div>
            }
        </div>
    </div>
</section>
