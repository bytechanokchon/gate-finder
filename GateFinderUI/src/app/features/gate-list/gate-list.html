<app-image-upload />

@if (packageDatas.length > 0) {
<div class="w-[70%]">
    <div class="flex justify-center">
        <hr class="mb-5 mt-5" />
    </div>
</div>

<div class="flex justify-center mb-10">
    <div class="flex flex-wrap gap-3 w-[70%] justify-start">
        @for (gateData of gateDatas; track gateData) {
        <div class="p-3 border rounded w-[24%] flex flex-col justify-between gap-5">
            <div>
                <p class="font-bold">รหัสสินค้า</p>
                <p>{{ gateData.productId }}</p>
            </div>

            <div>
                <p class="font-bold">ที่อยู่จัดส่ง</p>
                <p>{{ gateData.productAddress }}</p>
            </div>

            <div>
                <p class="font-bold">สินค้าจะต้องไปอยู่ที่ประตู</p>
                <p class="text-center text-5xl">{{ gateData.gate ?? '-' }}</p>
            </div>
        </div>
        }
    </div>
</div>
}
